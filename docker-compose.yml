# ==============================================================================
# DOCKER COMPOSE — Orquestador del Proyecto Completo
# ==============================================================================
# Levanta los 3 servicios con un solo comando:
#   docker compose up --build
#
# Servicios:
#   1. db       — PostgreSQL 16 + pgvector (con datos seed)
#   2. backend  — FastAPI + LangGraph + Gemini
#   3. frontend — Next.js 16 (standalone production build)
# ==============================================================================

services:
  # --------------------------------------------------------------------------
  # 1. BASE DE DATOS — PostgreSQL 16 + pgvector
  # --------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: proyecto_notas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: notes_db
      POSTGRES_USER: notes_user
      POSTGRES_PASSWORD: notes_password
    ports:
      - "5432:5432"
    volumes:
      # Esquema inicial (se ejecuta solo en la PRIMERA creación del volumen).
      # Los datos personales nunca se montan como seed para evitar que Docker cree
      # un directorio cuando el archivo opcional no existe.
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./db/migrate_knowledge_v2.sql:/docker-entrypoint-initdb.d/02_knowledge_v2.sql
      # Volumen persistente para datos
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes_user -d notes_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------------------
  # 2. BACKEND — FastAPI + LangGraph + Gemini
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proyecto_notas_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Inyectar todas las variables de entorno del .env del backend
    env_file:
      - ./backend/.env
    environment:
      # Override: en Docker, la DB es el servicio 'db', no localhost
      DATABASE_URL: postgresql://notes_user:notes_password@db:5432/notes_db
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_started

  # --------------------------------------------------------------------------
  # 3. FRONTEND — Next.js 16 (Standalone)
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # El frontend hace requests client-side (desde el navegador),
        # así que apunta al puerto expuesto del backend en el host
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: proyecto_notas_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # --------------------------------------------------------------------------
  # 2.5. ALMACENAMIENTO DE OBJETOS — RustFS (S3 Compatible - Apache 2.0)
  # --------------------------------------------------------------------------
  rustfs:
    image: rustfs/rustfs:latest
    container_name: proyecto_notas_storage
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfsdata:/data
    environment:
      RUSTFS_ACCESS_KEY: rustfs_admin
      RUSTFS_SECRET_KEY: rustfs_password
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data

volumes:
  pgdata:
    driver: local
  rustfsdata:
    driver: local
