# ==============================================================================
# DOCKER COMPOSE — Orquestador del Proyecto Completo
# ==============================================================================
# Levanta los cinco servicios persistentes y el migrador temporal:
#   docker compose up --build
#
# Servicios:
#   db / db-migrate — PostgreSQL 16 + pgvector y migraciones aditivas
#   backend — FastAPI, LangGraph/OpenRouter y workers de aplicación
#   frontend — Next.js 16 (standalone production build)
#   document-worker — Extracción/OCR PDF/EPUB y visión remota opcional
#   rustfs — Almacenamiento de objetos S3 persistente
# ==============================================================================

services:
  # --------------------------------------------------------------------------
  # 1. BASE DE DATOS — PostgreSQL 16 + pgvector
  # --------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: proyecto_notas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: notes_db
      POSTGRES_USER: notes_user
      POSTGRES_PASSWORD: notes_password
    ports:
      - "5432:5432"
    volumes:
      # Esquema inicial (se ejecuta solo en la PRIMERA creación del volumen).
      # Los datos personales nunca se montan como seed para evitar que Docker cree
      # un directorio cuando el archivo opcional no existe.
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./db/migrate_knowledge_v2.sql:/docker-entrypoint-initdb.d/02_knowledge_v2.sql
      - ./db/migrate_local_sync.sql:/docker-entrypoint-initdb.d/03_local_sync.sql
      - ./db/migrate_flashcards_suite.sql:/docker-entrypoint-initdb.d/04_flashcards_suite.sql
      - ./db/migrate_document_processing.sql:/docker-entrypoint-initdb.d/05_document_processing.sql
      - ./db/migrate_structured_notes.sql:/docker-entrypoint-initdb.d/06_structured_notes.sql
      - ./db/migrate_regeneration_jobs.sql:/docker-entrypoint-initdb.d/07_regeneration_jobs.sql
      - ./db/migrate_global_agent.sql:/docker-entrypoint-initdb.d/08_global_agent.sql
      # Volumen persistente para datos
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes_user -d notes_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Migración idempotente para volúmenes PostgreSQL ya existentes. No elimina
  # datos ni recrea el volumen; falla antes de iniciar la app si el SQL falla.
  db-migrate:
    image: pgvector/pgvector:pg16
    container_name: proyecto_notas_db_migrate
    restart: "no"
    environment:
      PGPASSWORD: notes_password
    volumes:
      - ./db/migrate_structured_notes.sql:/migration.sql:ro
      - ./db/migrate_regeneration_jobs.sql:/regeneration.sql:ro
      - ./db/migrate_global_agent.sql:/agent.sql:ro
    command: ["psql", "-h", "db", "-U", "notes_user", "-d", "notes_db", "-v", "ON_ERROR_STOP=1", "-f", "/migration.sql", "-f", "/regeneration.sql", "-f", "/agent.sql"]
    depends_on:
      db:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # 2. BACKEND — FastAPI + LangGraph + OpenRouter
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proyecto_notas_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Inyectar todas las variables de entorno del .env del backend
    env_file:
      - ./backend/.env
    environment:
      # Override: en Docker, la DB es el servicio 'db', no localhost
      DATABASE_URL: postgresql://notes_user:notes_password@db:5432/notes_db
      LOCAL_SYNC_ROOT: /sync
      LOCAL_SYNC_INTERVAL_SECONDS: ${LOCAL_SYNC_INTERVAL_SECONDS:-3}
    volumes:
      # La ruta del host se configura antes de iniciar Docker. La interfaz sólo
      # navega dentro de esta raíz montada.
      - ${NOTES_SYNC_PATH:-./synced-notes}:/sync
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      rustfs:
        condition: service_started

  # --------------------------------------------------------------------------
  # 3. FRONTEND — Next.js 16 (Standalone)
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # El frontend hace requests client-side (desde el navegador),
        # así que apunta al puerto expuesto del backend en el host
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: proyecto_notas_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Procesamiento persistente y aislado de PDF/EPUB (CPU, concurrencia 1).
  document-worker:
    build:
      context: ./document-worker
      dockerfile: Dockerfile
    container_name: proyecto_notas_document_worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://notes_user:notes_password@db:5432/notes_db
      RUSTFS_ENDPOINT_INTERNAL: http://rustfs:9000
      RUSTFS_ENDPOINT_EXTERNAL: http://localhost:9000
      RUSTFS_ACCESS_KEY: rustfs_admin
      RUSTFS_SECRET_KEY: rustfs_password
      RUSTFS_BUCKET_NAME: notes-images
      DOCUMENT_WORKER_POLL_SECONDS: ${DOCUMENT_WORKER_POLL_SECONDS:-2}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      rustfs:
        condition: service_started

  # --------------------------------------------------------------------------
  # 2.5. ALMACENAMIENTO DE OBJETOS — RustFS (S3 Compatible - Apache 2.0)
  # --------------------------------------------------------------------------
  rustfs:
    image: rustfs/rustfs:latest
    container_name: proyecto_notas_storage
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfsdata:/data
    environment:
      RUSTFS_ACCESS_KEY: rustfs_admin
      RUSTFS_SECRET_KEY: rustfs_password
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data

volumes:
  pgdata:
    driver: local
  rustfsdata:
    driver: local
